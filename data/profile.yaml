# Personal Investment Profile
# Sources: CRA NOA 2024 & 2025, Manulife Dec 2025 annual statement, WealthSimple Feb 2026

personal:
  birth_year: 1993
  canadian_resident_since: "2020-02-01"   # TFSA room accrues from 2020
  province: ON
  annual_income: 124000                   # 2026 salary
  prior_year_income: 151870               # 2025 total income per NOA (line 15000)

accounts:
  tfsa:
    current_room_available: 30562.89      # CRA as of Jan 1, 2026
    ytd_contributions: 0                  # Update if you've contributed to TFSA in 2026
    ytd_withdrawals: 0

  rrsp:
    current_room_available: 69073.00      # CRA RRSP deduction limit as of 2025 NOA (lifetime accumulated room)
    # Per CRA INVESTMENT_RULES.md rule #3: always use NOA/CRA figure directly.
    # $69,073 is the accumulated deduction limit from 2025 NOA — do not recalculate.
    ytd_contributions: 0

  hbp:
    balance_left_to_repay: 7453.00        # Per 2025 NOA
    annual_repayment_required: 621.00     # Minimum required for 2026

  rpp:
    # Employer Registered Pension Plan (Manulife, locked-in Ontario)
    # 2% of salary deducted per paycheck; employer matches 100%
    member_annual_contribution: 2480
    employer_annual_contribution: 2480
    value_dec_2025: 13550.02             # From Manulife Dec 2025 statement

  resp:
    beneficiaries: []                     # No RESP yet
    # TODO: Open RESP to start capturing CESG immediately

contribution_plans:
  # Payroll contributions (automatic — already happening)
  rpp_annual_member: 2480                 # 2% of salary, via payroll to RPP
  manulife_rrsp_annual: 2230             # ~estimated from payroll (voluntary group RRSP)
  # Personal contributions (set your targets below)
  tfsa_annual: 0                          # TODO: how much extra do you want to save in TFSA?
  rrsp_annual_personal: 0                # TODO: any personal RRSP contributions beyond payroll?
  resp_annual: 2500                       # Target $2,500/yr per child once RESP opened (max CESG)

retirement:
  target_retirement_age: 55              # Early retirement target
  target_monthly_income: 10000           # $10,000/month in today's dollars
  cpp_estimate_monthly: 0               # TODO: get from Service Canada MySRA account
  # Note: at age 55 you won't receive CPP until 60 (early) or 65 (standard)
  # RPP is locked-in; earliest access is age 55 per Manulife
  oas_estimate_monthly: 727             # OAS starts at 65 — won't apply at age-55 retirement

risk_tolerance: moderate-growth         # Between balanced (7%) and growth (9%) → 8%

# Total deposits override — used in "Invested vs Current Value" table.
# Keys must match account_id exactly. Set for any account where you know the exact total deposited.
# If not set, falls back to book cost from the latest statement (slightly overstates due to reinvested dividends).
# Update after adding new contributions or receiving new statements.
cost_basis_overrides:
  HF4253745CAD_RRSP: 4000      # WS RRSP — total contributions to date
  # H947126K9CAD_TFSA: 0       # TODO: fill in total TFSA deposits to date
  # WZ0969XK4CAD_TFSA_PORTFOLIO: 0  # TODO: fill in total managed TFSA deposits to date
  manulife_RPP: 10800           # Total contributions (member + employer match) to date
  manulife_RRSP: 1800           # Total contributions deposited to Manulife group RRSP to date

# Prior year contribution room — used for "last year" chart on dashboard
# Sources: CRA TFSA room calculation (line 1-6 per CRA MyAccount)
prior_year_contributions:
  year: 2025
  tfsa_room_start: 33562.89            # CRA Jan 1, 2025 TFSA room (line 1)
  tfsa: 10000.00                       # Total TFSA contributions in 2025 (CRA line 2)
  rrsp_room_start: 43308.00            # RRSP deduction limit at start of 2025 (from NOA 2024)
  rrsp: 2230.00                        # Manulife group RRSP contributions in 2025 (estimated)
